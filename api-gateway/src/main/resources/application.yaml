server:
  port: ${API_GATEWAY_PORT:8080}

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
      server:
        webflux:
          routes:
            # ========== IDENTITY ==========
            - id: identity_service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:${IDENTITY_SERVICE_PORT:8081}}
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2
            # ========== PROFILE ==========
            - id: profile_service
              uri: ${PROFILE_SERVICE_URL:http://localhost:${PROFILE_SERVICE_PORT:8082}}
              predicates:
                - Path=${app.api-prefix}/profile/**
              filters:
                - StripPrefix=2
            # ========== PROFILE - Internal endpoints (for direct service calls) ==========
            - id: profile_service_internal
              uri: ${PROFILE_SERVICE_URL:http://localhost:${PROFILE_SERVICE_PORT:8082}}
              predicates:
                - Path=/profile/internal/**
              filters:
                - StripPrefix=1
            # ========== NOTIFICATION ==========
            - id: notification_service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:${NOTIFICATION_SERVICE_PORT:8083}}
              predicates:
                - Path=${app.api-prefix}/notification/**
              filters:
                - StripPrefix=2
            # ========== POST ==========
            - id: post_service
              uri: ${POST_SERVICE_URL:http://localhost:${POST_SERVICE_PORT:8084}}
              predicates:
                - Path=${app.api-prefix}/post/**
              filters:
                - StripPrefix=2
            # ========== FILE ==========
            - id: file_service
              uri: ${FILE_SERVICE_URL:http://localhost:${FILE_SERVICE_PORT:8085}}
              predicates:
                - Path=${app.api-prefix}/file/**
              filters:
                - StripPrefix=2
            # ========== CHAT ==========
            - id: chat_service
              uri: ${CHAT_SERVICE_URL:http://localhost:${CHAT_SERVICE_PORT:8086}}
              predicates:
                - Path=${app.api-prefix}/chat/**
              filters:
                - StripPrefix=2
            # ========== SOCIAL ==========
            - id: social_service
              uri: ${SOCIAL_SERVICE_URL:http://localhost:${SOCIAL_SERVICE_PORT:8087}}
              predicates:
                - Path=${app.api-prefix}/social/**
              filters:
                - StripPrefix=2
            # ========== INTERACTION ==========
            - id: interaction_service
              uri: ${INTERACTION_SERVICE_URL:http://localhost:${INTERACTION_SERVICE_PORT:8088}}
              predicates:
                - Path=${app.api-prefix}/interaction/**
              filters:
                - StripPrefix=2
            # ========== GROUP ==========
            - id: group_service
              uri: ${GROUP_SERVICE_URL:http://localhost:${GROUP_SERVICE_PORT:8089}}
              predicates:
                - Path=${app.api-prefix}/group/**
              filters:
                - StripPrefix=2
            # ========== AI ==========
            - id: ai_service
              uri: ${AI_SERVICE_URL:http://localhost:${AI_SERVICE_PORT:8090}}
              predicates:
                - Path=${app.api-prefix}/ai/**
              filters:
                - StripPrefix=2
            # ========== MODERATION ==========
            - id: moderation_service
              uri: ${MODERATION_SERVICE_URL:http://localhost:${MODERATION_SERVICE_PORT:8091}}
              predicates:
                - Path=${app.api-prefix}/moderation/**
              filters:
                - StripPrefix=2

# Actuator: chi mo health va info. Cac endpoint con lai (env, loggers, heapdump) khong
# duoc expose vi chung lo cau hinh va bien moi truong ra ngoai.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
