server:
  port: ${GROUP_SERVICE_PORT:8089}
  servlet:
    context-path: /group

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

spring:
  application:
    name: group-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:814362@localhost:${MONGODB_PORT:27018}/group-service?authSource=admin}
app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL:http://localhost:${PROFILE_SERVICE_PORT:8082}/profile}
    file:
      url: ${FILE_SERVICE_URL:http://localhost:${FILE_SERVICE_PORT:8085}/file}

# Actuator: chi mo health va info. Cac endpoint con lai (env, loggers, heapdump) khong
# duoc expose vi chung lo cau hinh va bien moi truong ra ngoai.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
