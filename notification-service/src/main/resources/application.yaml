server:
  port: 8083
  servlet:
    context-path: /notification

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:814362@localhost:27018/notification-service?authSource=admin}
notification:
  email:
    brevo-url: ${BREVO_URL:https://api.brevo.com}
    # Default rỗng để service khởi động được; gửi email chỉ hoạt động khi set BREVO_APIKEY thật.
    brevo-apikey: ${BREVO_APIKEY:}
