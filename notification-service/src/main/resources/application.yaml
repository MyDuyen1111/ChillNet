server:
  port: ${NOTIFICATION_SERVICE_PORT:8083}
  servlet:
    context-path: /notification

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:814362@localhost:${MONGODB_PORT:27018}/notification-service?authSource=admin}
notification:
  email:
    brevo-url: ${BREVO_URL:https://api.brevo.com}
    # Default rỗng để service khởi động được; gửi email chỉ hoạt động khi set BREVO_APIKEY thật.
    brevo-apikey: ${BREVO_APIKEY:}
    sender-name: ${BREVO_SENDER_NAME:ChillNet}
    sender-email: ${BREVO_SENDER_EMAIL:}

# Actuator: chi mo health va info. Cac endpoint con lai (env, loggers, heapdump) khong
# duoc expose vi chung lo cau hinh va bien moi truong ra ngoai.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
