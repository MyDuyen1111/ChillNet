# Hạ tầng local cho ChillNet: MySQL + MongoDB + MinIO (đã cap RAM cho máy yếu).
# Chạy: docker compose -f docker-compose.infra.yml up -d
# Dừng: docker compose -f docker-compose.infra.yml down
services:
  mysql:
    image: mysql:8
    container_name: chillnet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "814362"
    command: --innodb-buffer-pool-size=256M
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/mysql-init:/docker-entrypoint-initdb.d:ro
      - chillnet_mysql_data:/var/lib/mysql
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p814362"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:6
    container_name: chillnet-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "814362"
    command: --wiredTigerCacheSizeGB 0.5
    ports:
      # 27018 phía host vì 27017 hay bị chiếm (VSCode/Mongo có sẵn trên máy dev)
      - "27018:27017"
    volumes:
      - chillnet_mongo_data:/data/db
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage cho file-service (thay Cloudinary). Bucket và policy
  # public-read do file-service tự tạo lúc khởi động, nên không cần sidecar `mc`.
  minio:
    image: minio/minio:latest
    container_name: chillnet-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chillnet
      MINIO_ROOT_PASSWORD: "chillnet814362"
    ports:
      - "9000:9000" # S3 API — file-service gọi vào đây
      - "9001:9001" # Web console để xem ảnh đã lên
    volumes:
      - chillnet_minio_data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  chillnet_mysql_data:
  chillnet_mongo_data:
  chillnet_minio_data:
