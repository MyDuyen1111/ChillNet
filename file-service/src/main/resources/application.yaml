server:
  port: 8085
  servlet:
    context-path: /file

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:814362@localhost:27018/file-service?authSource=admin}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
cloudinary:
  # Default rỗng để service khởi động được; upload ảnh chỉ hoạt động khi set key Cloudinary thật.
  cloud-name: ${CLOUD_NAME:}
  api-key: ${API_KEY:}
  api-secret: ${API_SECRET:}

logging:
  level:
    org:
      springframework: INFO
