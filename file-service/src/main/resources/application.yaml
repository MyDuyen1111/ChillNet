server:
  port: 8085
  servlet:
    context-path: /file

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:814362@localhost:27018/file-service?authSource=admin}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
minio:
  # Default khớp docker-compose.infra.yml nên chạy local không cần set gì thêm.
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:chillnet}
  secret-key: ${MINIO_SECRET_KEY:chillnet814362}
  bucket: ${MINIO_BUCKET:chillnet-media}
  # URL trình duyệt dùng để tải ảnh. Tách khỏi `endpoint` vì khi chạy trong Docker
  # file-service gọi http://minio:9000 còn trình duyệt vẫn phải là localhost.
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

logging:
  level:
    org:
      springframework: INFO
