server:
  port: ${SOCIAL_SERVICE_PORT:8087}
  servlet:
    context-path: /social

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

spring:
  application:
    name: social-service
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:${MYSQL_PORT:3306}/social_service}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:814362}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL:http://localhost:${PROFILE_SERVICE_PORT:8082}/profile}

# Actuator: chi mo health va info. Cac endpoint con lai (env, loggers, heapdump) khong
# duoc expose vi chung lo cau hinh va bien moi truong ra ngoai.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
