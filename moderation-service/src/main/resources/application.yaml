server:
  port: 8091
  servlet:
    context-path: /moderation

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

spring:
  application:
    name: moderation-service
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/moderation_service?createDatabaseIfNotExist=true}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:814362}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  services:
    profile:
      url: http://localhost:8082/profile
    notification:
      url: http://localhost:8083/notification
    post:
      url: http://localhost:8084/post
    interaction:
      url: http://localhost:8088/interaction
    group:
      url: http://localhost:8089/group
    identity:
      url: http://localhost:8081/identity
