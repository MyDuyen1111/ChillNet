server:
  port: ${POST_SERVICE_PORT:8084}
  servlet:
    context-path: /post

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

spring:
  application:
    name: post-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:814362@localhost:${MONGODB_PORT:27018}/post-service?authSource=admin}
app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL:http://localhost:${PROFILE_SERVICE_PORT:8082}/profile}
    social:
      url: ${SOCIAL_SERVICE_URL:http://localhost:${SOCIAL_SERVICE_PORT:8087}/social}
    interaction:
      url: ${INTERACTION_SERVICE_URL:http://localhost:${INTERACTION_SERVICE_PORT:8088}/interaction}
    group:
      url: ${GROUP_SERVICE_URL:http://localhost:${GROUP_SERVICE_PORT:8089}/group}
    file:
      url: ${FILE_SERVICE_URL:http://localhost:${FILE_SERVICE_PORT:8085}/file}
    ai:
      url: ${AI_SERVICE_URL:http://localhost:${AI_SERVICE_PORT:8090}/ai}

# Actuator: chi mo health va info. Cac endpoint con lai (env, loggers, heapdump) khong
# duoc expose vi chung lo cau hinh va bien moi truong ra ngoai.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
